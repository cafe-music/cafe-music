else if(t.dataset.ch!=null){CC.lk[CC.p]="#"+[0,1,2].map(i=>(+$('[data-ch="'+i+'"]').value).toString(16).padStart(2,"0")).join("");rgbUI();cprev()}
else if(t.id=="hx"&&HX.test(t.value)){CC.lk[CC.p]=t.value.toLowerCase();rgbUI(true);cprev()}});
const act={close:()=>closeModal(),help:()=>help(),room:()=>rooms(),
stop:()=>{if(document.activeElement)document.activeElement.blur();if(BR&&BR.act)BR.act()},pk:v=>BR&&BR.pk&&BR.pk(v),
inst:v=>startPerf(+v),
o:v=>{const[k,i]=v.split(":");if(k=="r")CC.r=i;else if(k=="p")CC.p=+i;else if(k=="h"){CC.lk[1]=+i;if(!+i&&CC.p==3)CC.p=2}else if(k=="s")CC.lk[0]=+i;cc()},
chg:()=>{CC={nm:S.nm,lk:S.lk.slice(),r:ME.r,p:2};cc()},
go:()=>{S.nm=CC.nm.trim().slice(0,12)||"Bạn";S.lk=CC.lk.slice();S.r=CC.r;closeModal();begin()},
star:id=>{const r=ALL.find(r=>r.id==id);if(!r||r===ME)return;cool[id]=Date.now()+15000;MYSG[id]=(MYSG[id]||0)+1;r.st++;F.push({x:r.x,y:r.y-95,s:"⭐ +1",t:1.4});pub();toast("⭐ Bạn đã tặng sao cho "+r.nm);closeModal()},
kick:id=>{const cp=curPerf();if(!cp||cp.w.id!=id||cp.w===ME)return;vk=id;pub();toast("🚫 Bạn đã bỏ phiếu đuổi "+cp.w.nm);closeModal()},
order:v=>{ME.od={d:+v,n:++oseq};pub();toast("Đã gọi "+DR[+v].n);closeModal()},cancel:()=>{ME.od=null;pub();closeModal()},
make:id=>{const r=RP[id];if(!r||!r.od)return;const od=r.od;closeModal();runSteps(DR[od.d],q=>{MYSV[id]={n:od.n,q:Math.round(q*100)};const ks=Object.keys(MYSV);if(ks.length>8)delete MYSV[ks[0]];pub();toast("Đã giao "+DR[od.d].n+" cho "+r.nm)})},
prac:v=>{closeModal();runSteps(DR[+v],q=>toast("Luyện tập xong: "+Math.round(q*100)+"% hoàn hảo"))},
mk:()=>{const c="abcdefghjkmnpqrstuvwxyz23456789";let id="";for(let i=0;i<5;i++)id+=c[fl(R()*c.length)];joinRoom(id).then(()=>{if(RID)openModal(`<h3>🎉 Đã tạo phòng riêng</h3><p>ID phòng của bạn:</p><div style="font:400 56px VT323,monospace;text-align:center;-webkit-user-select:text;user-select:text">${esc(RID)}</div><p>Gửi ID này cho bạn bè: họ bấm 🔑 rồi nhập ID để vào cùng.</p><button class="b big" data-a="close">OK</button>`)})},
jn:()=>joinRoom($("#rid").value).then(()=>closeModal()),
lobby:()=>joinRoom("").then(()=>closeModal())};
$("#mb").onclick=e=>{const b=e.target.closest("[data-a]");if(b&&!b.disabled)act[b.dataset.a](b.dataset.v,b)};
$("#qx").onclick=()=>leaveStage();$("#gear").onclick=()=>{if(started&&!BR&&!RG)settings()};$("#vw").onclick=()=>{VIEW=1-VIEW};$("#vt").onclick=()=>{const cp=curPerf();if(!cp||cp.w===ME)return;vk=vk==cp.w.id?null:cp.w.id;pub();hud()};$("#rm").onclick=()=>{if(started&&!BR&&!RG)rooms()};
$("#nav").onclick=e=>{const b=e.target.closest("[data-n]");if(!b||!started||BR||RG)return;const n=b.dataset.n;if(n=="g")goSeat(-1);else if(n=="b")goBar();else if(n=="m")goStage();else if(ME.r=="b")ordersList();else menu()};
function hud(){if(!started)return;const set=(id,t)=>{const e=$(id);if(e.textContent!==t)e.textContent=t};
TOP=ALL.slice().sort((a,b)=>b.st-a.st).slice(0,4);
set("#sv","⭐ "+S.stars);if(ENV){const hh=fl(ENV.h),mm=fl(ENV.h%1*60);set("#cl",(ENV.rn>.1?"🌧️":ENV.day<.3?"🌙":ENV.cd>.55?"⛅":"☀️")+" "+String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0"))}set("#ro","🎭 "+ROLE[ME.r]);set("#pp","👥 "+ALL.filter(r=>r.seat!=-1).length+"/20");set("#rm","🔑 "+(RID||"Sảnh chung"));
const cp=curPerf();set("#tm",cp?"🎤 "+cp.w.nm+" "+fmt(cp.rem):"");$("#tm").style.display=cp?"":"none";const vt=$("#vt"),sv2=cp&&cp.w!==ME;vt.style.display=sv2?"":"none";if(sv2)vt.textContent=(vk==cp.w.id?"✋ Rút phiếu ":"🗳 Đuổi ")+votesFor(cp.w.id)+"/"+need();$("#vw").textContent=VIEW?"🗺":"📷";
$("#nv4").lastChild.textContent=ME.r=="b"?"Đơn hàng":"Gọi đồ";
set("#hint",ALL.length<2?"Phòng đang vắng – bấm 🔑 để tạo phòng riêng và gửi ID cho bạn bè, hoặc lên 🎤 sân khấu tự chơi nhạc.":ME.r=="b"?"👆 Chạm khách có bong bóng để pha chế · chạm bạn bè để tặng ⭐":"👆 Chạm bạn bè hoặc nghệ sĩ để tặng ⭐ · chạm ghế trống để đổi chỗ")}
cv.addEventListener("pointerdown",e=>{if(RG||BR||!started)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;if(VIEW)return;if(x>706&&x<792&&y>10&&y<98){ME.r=="b"?ordersList():menu();return}let b=null,bd=34;
ALL.forEach(c=>{const d=Math.min(Math.hypot(c.x-x,c.y-38-y),c.od?Math.hypot(c.x-x,c.y-125-y)+10:99);if(d<bd){bd=d;b=c}});
if(b){if(ME.r=="b"&&b.od&&b!==ME&&!(MYSV[b.id]&&MYSV[b.id].n==b.od.n))act.make(b.id);else who(b);return}
const i=SE.findIndex((s,k)=>Math.hypot(s.x-x,s.y-y)<24&&!used().includes(k));if(i>=0)goSeat(i)});

/* ===== KHỞI ĐỘNG & VÒNG LẶP ===== */
function boot(){ME={id:"me",nm:S.nm,lk:S.lk,r:"g",seat:-1,x:830,y:440,ent:0,st:S.stars,od:null,dr:null};RP={};IS.me={V:{},hd:{},fr:0,f0:1};build()}
function begin(){$("#st").style.display="none";
if(!started){started=true;A.v=S.v;A.init();boot()}else{ME.nm=S.nm;ME.lk=S.lk;ME.x=830;ME.y=440;ME.ent=0;ME.seat=-1}if(A.ac)A.bell();
if(S.r=="b")goBar();else goSeat(-1);
if(!S.tut){S.tut=1;help()}else{closeModal();if(S.r=="m")goStage()}
save();pub()}
const hasSave=!!load();$("#cont").style.display=hasSave?"":"none";
$("#cont").onclick=()=>{S=load();begin()};
$("#newb").onclick=function(){if(hasSave&&!this.dataset.s){this.dataset.s=1;this.textContent="Ghi đè bản lưu? Bấm lần nữa";return}S=mkSave();CC={nm:"",lk:S.lk.slice(),r:"g",p:2};$("#st").style.display="none";cc()};
addEventListener("pagehide",()=>{if(started)save()});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&started)save()});
let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1e3);last=n;
try{if(started){update(dt);(VIEW?drawFront:draw)(n/1e3);if((hT+=dt)>.2){hT=0;hud()}}}catch(e){console.error(e)}
requestAnimationFrame(loop)})(last);
</script>
</body>
</html>
